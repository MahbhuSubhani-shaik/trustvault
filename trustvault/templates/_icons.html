{# Inline SVG icons. Each one sits next to a visible text label, so they are
   aria-hidden. Colour comes from CSS through currentColor. #}

{% macro logo(size=26) -%}
<svg class="logo" width="{{ size }}" height="{{ size }}" viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect x="3" y="6" width="26" height="22" rx="3" stroke="#F1F5FF" stroke-width="2"/><path d="M3 12h26" stroke="#F1F5FF" stroke-width="2"/><circle cx="16" cy="20" r="3.5" stroke="#5EEAD4" stroke-width="2"/><path d="M16 23.5V26" stroke="#5EEAD4" stroke-width="2"/></svg>
{%- endmacro %}

{% macro icon(name, size=18) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
{%- if name == 'file' -%}
<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/>
{%- elif name == 'lock' -%}
<rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>
{%- elif name == 'alert' -%}
<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16v.5"/>
{%- elif name == 'link' -%}
<path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>
{%- elif name == 'shield' -%}
<path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>
{%- elif name == 'check-circle' -%}
<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>
{%- elif name == 'warning' -%}
<path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17v.5"/>
{%- elif name == 'home' -%}
<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>
{%- elif name == 'search' -%}
<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>
{%- elif name == 'grid' -%}
<rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/>
{%- elif name == 'dot' -%}
<circle cx="12" cy="12" r="2.5" fill="currentColor"/>
{%- elif name == 'plus' -%}
<path d="M12 5v14M5 12h14"/>
{%- elif name == 'clock' -%}
<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{%- elif name == 'check' -%}
<path d="M5 12.5l4.5 4.5L19 7.5"/>
{%- elif name == 'users' -%}
<circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0"/><path d="M17 11h5M19.5 8.5v5"/>
{%- elif name == 'upload' -%}
<path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/>
{%- endif -%}
</svg>
{%- endmacro %}
